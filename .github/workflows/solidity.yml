name: Solidity

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SEI_DOCKER_IMAGE: ghcr.io/sei-protocol/sei:v6.0.5
      SEI_TEST_LOGS: "1"

    defaults:
      run:
        working-directory: solidity

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: solidity/package-lock.json

      - name: Pull Sei Docker image
        run: docker pull "$SEI_DOCKER_IMAGE"

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run live Sei tests
        run: npm test
